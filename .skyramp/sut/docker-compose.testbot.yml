# Generated by Skyramp Testbot SUT bootstrap.
# Builds and runs the Directus application (API + bundled admin UI) from PR source
# using the repo's existing root Dockerfile, backed by SQLite (no external DB needed).
services:
  directus:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8055:8055'
    environment:
      ADMIN_EMAIL: admin@testbot.com
      ADMIN_PASSWORD: testbot
      ADMIN_TOKEN: testbot-static-admin-token
      SECRET: testbot-directus-secret-do-not-use-in-production
      PUBLIC_URL: http://localhost:8055
      HEALTHCHECK_ENABLED: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8055/server/info || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
